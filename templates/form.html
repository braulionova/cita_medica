<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Cita Médica</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4 py-8">

  <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-lg">
    <h2 class="text-xl sm:text-2xl font-bold mb-2 text-center text-gray-800">Dra. Jennifer Reyes</h2>
    <h3 class="text-lg sm:text-xl font-semibold mb-6 text-center text-gray-700">Registro de Cita Médica</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4">
          {% for category, message in messages %}
            <div {% if category == 'success' %}id="flash-success"{% endif %} class="p-3 rounded text-sm sm:text-base
              {% if category == 'success' %} bg-green-100 text-green-800 {% else %} bg-red-100 text-red-800 {% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-4" autocomplete="off">
      
      <!-- Cédula con Máscara y Autocompletado -->
      <div>
        <label for="cedula" class="block text-gray-700 mb-1 text-sm sm:text-base">Cédula de Identidad (Opcional)</label>
        <input type="text" id="cedula" name="cedula"
          placeholder="000-0000000-0"
          pattern="^\d{3}-\d{7}-\d{1}$"
          title="Formato requerido: 000-0000000-0"
          autocomplete="off"
          class="w-full px-3 sm:px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base">
        <p class="text-xs text-gray-500 mt-1">Si ya se ha registrado, sus datos se cargarán al salir del campo.</p>
      </div>

      <!-- Nombre -->
      <div>
        <label for="nombre" class="block text-gray-700 mb-1 text-sm sm:text-base">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required autocomplete="off"
          class="w-full px-3 sm:px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base">
      </div>
      
      <!-- Teléfono -->
      <div>
        <label for="telefono" class="block text-gray-700 mb-1 text-sm sm:text-base">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" required autocomplete="off"
          class="w-full px-3 sm:px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base">
      </div>

      <!-- Nombre del Seguro Médico -->
      <div>
        <label for="nombre_seguro_medico" class="block text-gray-700 mb-1 text-sm sm:text-base">Nombre del Seguro Médico</label>
        <input list="seguros-list" id="nombre_seguro_medico" name="nombre_seguro_medico"
          placeholder="Seleccione o escriba el nombre..."
          class="w-full px-3 sm:px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base">
        <datalist id="seguros-list">
          <option value="SENASA"></option>
          <option value="HUMANO"></option>
          <option value="BANRESERVAS"></option>
          <option value="UNIVERSAL"></option>
          <option value="CONSTITUCION"></option>
          <option value="NINGUNO"></option>
          <option value="PALIC"></option>
          <option value="ASEMAP"></option>
          <option value="MONUMENTAL"></option>
          <option value="SALUD SEGURA"></option>
          <option value="SEMMA"></option>
          <option value="FUTURO"></option>
          <option value="AMOR Y PAZ"></option>
          <option value="RENACER"></option>
          <option value="METASALUD"></option>
          <option value="CMD"></option>
          <option value="UASD"></option>
          <option value="GMA"></option>
          <option value="SIGMAG"></option>
          <option value="APS"></option>
          <option value="MAPFRE"></option>
          <option value="PRIVADO"></option>
          <option value="SENANA CONTRIBUTIVO"></option>
          <option value="SENASA LARIMAR"></option>
          <option value="SENASA ESPECIAL PENCIONADO"></option>
          <option value="SENASA CONTRIBUTIVO BASICO"></option>
          <option value="SENASA CONTRIBUTIVO"></option>
          <option value="SENASA TITULAR"></option>
          <option value="SENASA DEPENDIENTE"></option>
          <option value="SENASA AVANZADO"></option>
          <option value="SENASA PREMIUM"></option>
          <option value="SENASA MAXIMO"></option>
          <option value="OTRO"></option>
        </datalist>
      </div>

      <!-- Numero de seguro medico -->
      <div>
        <label for="numero_seguro_medico" class="block text-gray-700 mb-1 text-sm sm:text-base">Número de Afiliado / Póliza</label>
        <input id="numero_seguro_medico" name="numero_seguro_medico"
          class="w-full px-3 sm:px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base">
      </div>

      <!-- Fecha -->
      <div>
        <label for="fecha" class="block text-gray-700 mb-1 text-sm sm:text-base">Fecha de la cita</label>
        <input type="date" id="fecha" name="fecha" required
          class="w-full px-3 sm:px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base">
      </div>
      
      <!-- Motivo -->
      <div>
        <label for="motivo" class="block text-gray-700 mb-1 text-sm sm:text-base">Motivo de la consulta</label>
        <select id="motivo" name="motivo" required
          class="w-full px-3 sm:px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm sm:text-base">
          <option value="">Seleccione...</option>
          <option value="ginecologica">Consulta ginecológica</option>
          <option value="mama">Consulta de mama</option>
          <option value="post">Post quirúrgico</option>
          <option value="biopsia">Biopsia</option>
          <option value="resultados">Entrega de resultados</option>
        </select>
      </div> 
      <!-- Botón -->
<button id="submit-btn-public" type="submit"
        class="w-full bg-blue-600 text-white py-2 sm:py-3 px-4 rounded-lg hover:bg-blue-700 transition text-sm sm:text-base">
        Registrar Cita
      </button>
    </form>
  </div>

    <!-- POP-UP DE ERROR -->
  <div id="error-popup" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full text-center">
      <p id="popup-message" class="text-gray-800 mb-4 text-sm sm:text-base"></p>
      <button id="close-popup-btn"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm sm:text-base">
        Cerrar
      </button>
    </div>
  </div>

  <!-- SCRIPT UNIFICADO: MÁSCARA, AUTOCOMPLETADO Y VALIDACIÓN DE FECHA -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // --- Elementos del DOM ---
      const cedulaInput = document.getElementById('cedula');
      const nombreInput = document.getElementById('nombre');
      const telefonoInput = document.getElementById('telefono');
      const nombreSeguroInput = document.getElementById('nombre_seguro_medico');
      const numeroSeguroInput = document.getElementById('numero_seguro_medico');

      // --- 0. LIMPIAR EL FORMULARIO TRAS REGISTRAR UNA CITA ---
      // El servidor redirige (PRG) tras el éxito y muestra el flash de éxito.
      // Forzamos el reset para evitar que el autocompletado del navegador
      // vuelva a rellenar los campos.
      const formulario = document.querySelector('form');
      if (document.getElementById('flash-success') && formulario) {
        formulario.reset();
      }
      // También al volver con el botón "atrás" (página restaurada desde caché).
      window.addEventListener('pageshow', function (event) {
        if (event.persisted && formulario) {
          formulario.reset();
        }
      });

      // --- 1. LÓGICA PARA LA MÁSCARA DE CÉDULA ---
      cedulaInput.addEventListener('input', function (e) {
        // Eliminar todo lo que no sea dígito
        let value = e.target.value.replace(/\D/g, '');
        
        // Limitar a 11 dígitos
        value = value.slice(0, 11);
        
        // Aplicar formato con guiones
        if (value.length >= 3) {
          value = value.slice(0, 3) + '-' + value.slice(3);
        }
        if (value.length >= 11) {
          value = value.slice(0, 11) + '-' + value.slice(11);
        }
        
        e.target.value = value;
      });

      // --- 2. LÓGICA PARA AUTOCOMPLETAR DATOS ---
      cedulaInput.addEventListener('blur', async function() {
          const cedula = this.value.trim();
          // Solo buscar si la cédula tiene el formato completo (13 caracteres: 11 dígitos + 2 guiones)
          if (cedula.length !== 13) return;

          try {
              const response = await fetch(`/api/buscar_paciente/${cedula}`);
              
              if (response.ok) {
                  const paciente = await response.json();
                  // Rellenar campos si el paciente es encontrado
                  nombreInput.value = paciente.nombre_completo || '';
                  telefonoInput.value = paciente.telefono || '';
                  nombreSeguroInput.value = paciente.nombre_seguro_medico || '';
                  numeroSeguroInput.value = paciente.numero_seguro_medico || '';
              } else {
                  // Si no se encuentra (404), limpiar los campos para un nuevo registro
                  // (excepto nombre si el usuario ya lo había escrito)
                  // Esto evita borrar datos si el usuario se equivoca de cédula
                  console.log('Paciente no encontrado, listo para nuevo registro.');
              }
          } catch (error) {
              console.error('Error al buscar el paciente:', error);
          }
      });
    });

    // --- 3. LÓGICA PARA LA VALIDACIÓN DE FECHA (SIN CAMBIOS) ---
    const blockedDates = {{ fechas_bloqueadas|tojson }};
    const fullDates = {{ dias_llenos|tojson }}; 
    const config = {{ configuracion|tojson }};

    const dateInput = document.getElementById('fecha');
    const errorPopup = document.getElementById('error-popup');
    const popupMessage = document.getElementById('popup-message');
    const closePopupButton = document.getElementById('close-popup-btn');

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const formattedToday = today.toISOString().split('T')[0];
    dateInput.min = formattedToday;

    function formatDate(dateString) {
        const [year, month, day] = dateString.split('-');
        return `${day}/${month}/${year}`;
    }

    function isDayFull(dateString) {
        return fullDates.includes(dateString);
    }

    function showPopup(message) {
      popupMessage.textContent = message;
      errorPopup.classList.remove('hidden');
    }

    function hidePopup() {
      errorPopup.classList.add('hidden');
    }

    dateInput.addEventListener('change', function() {
      const selectedDate = this.value;
      if (!selectedDate) return;

      const dateObj = new Date(selectedDate + 'T00:00:00');
      const dayOfWeek = dateObj.getDay();
      let errorMessage = '';
      
      if (dateObj < today) {
        errorMessage = 'No se pueden agendar citas en fechas pasadas.';
      }
      else if (config.bloquear_sabados === 'true' && dayOfWeek === 6) {
        errorMessage = 'No se agendan citas los sábados. Por favor, elija otro día.';
      } 
      else if (config.bloquear_domingos === 'true' && dayOfWeek === 0) {
        errorMessage = 'No se agendan citas los domingos. Por favor, elija otro día.';
      } 
      else if (isDayFull(selectedDate)) {
        errorMessage = `Lo sentimos, el día ${formatDate(selectedDate)} ha alcanzado el límite de citas.`;
      }
      else if (blockedDates.includes(selectedDate)) {
        errorMessage = `La fecha ${formatDate(selectedDate)} no está disponible.`;
      }

      if (errorMessage) {
        showPopup(errorMessage);
        this.value = '';
      }
    });

closePopupButton.addEventListener('click', hidePopup);
    errorPopup.addEventListener('click', function(event) {
      if (event.target === event.currentTarget) {
        hidePopup();
      }
    });

    // --- 4. LÓGICA DE BLOQUEO DE BOTÓN CON VERIFICACIÓN ASÍNCRONA ---
    async function checkDuplicateAppointment() {
      const fecha = document.getElementById('fecha').value;
      const cedula = document.getElementById('cedula').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      
      if (!fecha || (!nombre && !telefono)) return false;
      
      try {
        const response = await fetch('/api/verificar_cita', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({fecha, cedula, nombre, telefono})
        });
        
        const result = await response.json();
        if (result.exists) {
          showPopup('⚠️ ' + result.message);
          return true;
        }
      } catch (error) {
        console.error('Error verificando cita:', error);
      }
      return false;
    }

    function setupSubmitButton(buttonId, formSelector) {
      const button = document.getElementById(buttonId);
      const form = document.querySelector(formSelector);
      
      if (!button || !form) {
        console.error(`No se encontró el botón ${buttonId} o el formulario ${formSelector}`);
        return;
      }
      
      function validateForm() {
        const nombre = document.getElementById('nombre').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const fecha = document.getElementById('fecha').value;
        const motivo = document.getElementById('motivo').value;
        
        if (!nombre || !telefono || !fecha || !motivo) {
          showPopup('Por favor, complete todos los campos obligatorios.');
          return false;
        }
        return true;
      }
      
      function blockButton() {
        button.disabled = true;
        button.innerHTML = '⏳ Procesando...';
        button.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        button.classList.add('bg-gray-400', 'cursor-not-allowed', 'opacity-75');
      }
      
      function unblockButton() {
        button.disabled = false;
        button.innerHTML = 'Registrar Cita';
        button.classList.remove('bg-gray-400', 'cursor-not-allowed', 'opacity-75');
        button.classList.add('bg-blue-600', 'hover:bg-blue-700');
      }
      
      form.addEventListener('submit', async function(e) {
        if (!validateForm()) {
          e.preventDefault();
          return;
        }
        
        // Verificar duplicados de forma asíncrona
        const hasDuplicate = await checkDuplicateAppointment();
        if (hasDuplicate) {
          e.preventDefault();
          return;
        }
        
        blockButton();
        
        // Timeout de seguridad (30 segundos)
        setTimeout(() => {
          unblockButton();
        }, 30000);
      });
    }

    // Inicializar el botón de envío para el formulario público
    setupSubmitButton('submit-btn-public', 'form');
  </script>

</body>
</html>
